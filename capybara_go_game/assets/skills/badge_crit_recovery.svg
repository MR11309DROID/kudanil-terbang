<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 84" width="76" height="84">
  <defs>
    <!-- Slate-Lavender Badge Gradient -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c5cee0"/>
      <stop offset="60%" stop-color="#a6b2c7"/>
      <stop offset="100%" stop-color="#93a0b7"/>
    </linearGradient>
    
    <!-- Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b8b"/>
      <stop offset="50%" stop-color="#ff3b68"/>
      <stop offset="100%" stop-color="#d91444"/>
    </linearGradient>

    <!-- Green Plus Gradient -->
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="30%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- 1. BASE BADGE BOX -->
  <rect x="3" y="14" width="70" height="66" rx="10" fill="#181d28" stroke="#181d28" stroke-width="4.5" stroke-linejoin="round"/>
  <rect x="4" y="15" width="68" height="64" rx="9" fill="url(#badgeBg)"/>

  <!-- Subtle inner background polka dots pattern -->
  <circle cx="16" cy="32" r="3" fill="#8492ab" opacity="0.4"/>
  <circle cx="16" cy="48" r="3" fill="#8492ab" opacity="0.4"/>
  <circle cx="16" cy="64" r="3" fill="#8492ab" opacity="0.4"/>

  <!-- 2. BROKEN PINK HEART -->
  <g transform="translate(38, 48)">
    <!-- Left Heart Half -->
    <path d="M 0,-18 C -14,-32 -32,-18 -32,2 C -32,18 -12,28 0,34 L 0,22 L -7,14 L 0,8 L -5,-2 L 0,-8 Z"
          fill="#181310" stroke="#181310" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 0,-18 C -14,-32 -32,-18 -32,2 C -32,18 -12,28 0,34 L 0,22 L -7,14 L 0,8 L -5,-2 L 0,-8 Z"
          fill="url(#heartGrad)"/>

    <!-- Right Heart Half -->
    <path d="M 0,-18 C 14,-32 32,-18 32,2 C 32,18 12,28 0,34 L 0,22 L -7,14 L 0,8 L -5,-2 L 0,-8 Z"
          fill="#181310" stroke="#181310" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 0,-18 C 14,-32 32,-18 32,2 C 32,18 12,28 0,34 L 0,22 L -7,14 L 0,8 L -5,-2 L 0,-8 Z"
          fill="url(#heartGrad)"/>

    <!-- Heart Top Left Specular Highlight -->
    <ellipse cx="-16" cy="-8" rx="5" ry="3.5" transform="rotate(-30, -16, -8)" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- 3. BOLD "30%" BADGE LABEL -->
  <text x="38" y="58"
        font-family="'Lilita One', 'Fredoka', 'Arial Black', sans-serif"
        font-size="18"
        font-weight="900"
        letter-spacing="-0.5"
        fill="#ffffff"
        stroke="#181310"
        stroke-width="4"
        paint-order="stroke fill"
        text-anchor="middle">
    30%
  </text>

  <!-- 4. BRIGHT LIME-GREEN PLUS "+" BADGE (Bottom-Right) -->
  <g transform="translate(56, 68)">
    <path d="M -4,-12 L 4,-12 L 4,-4 L 12,-4 L 12,4 L 4,4 L 4,12 L -4,12 L -4,4 L -12,4 L -12,-4 L -4,-4 Z"
          fill="#181310" stroke="#181310" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M -4,-12 L 4,-12 L 4,-4 L 12,-4 L 12,4 L 4,4 L 4,12 L -4,12 L -4,4 L -12,4 L -12,-4 L -4,-4 Z"
          fill="url(#plusGrad)"/>
    <line x1="-3" y1="-11" x2="3" y2="-11" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- 5. TOP "COMMON" PILL TAB WITH WHITE DIAMOND -->
  <!-- White Diamond Notch -->
  <polygon points="38,2 43,7 38,12 33,7" fill="#181d28" stroke="#181d28" stroke-width="2"/>
  <polygon points="38,3 42,7 38,11 34,7" fill="#ffffff"/>

  <!-- Pill Tab -->
  <rect x="7" y="8" width="62" height="15" rx="7.5" fill="#181d28" stroke="#181d28" stroke-width="3" stroke-linejoin="round"/>
  <rect x="8" y="9" width="60" height="13" rx="6.5" fill="#586180"/>
  <text x="38" y="19"
        font-family="'Lilita One', 'Fredoka', 'Arial Black', sans-serif"
        font-size="10"
        font-weight="900"
        letter-spacing="0.3"
        fill="#ffffff"
        text-anchor="middle">
    Common
  </text>
</svg>
