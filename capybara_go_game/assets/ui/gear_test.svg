<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32'>
  <g fill='#ffffff' stroke='#0d2847' stroke-width='2' stroke-linejoin='round'>
    <!-- 3 capsules at 0, 60, 120 deg forming 6 rounded teeth -->
    <rect x='4' y='12' width='24' height='8' rx='4' ry='4'/>
    <rect x='4' y='12' width='24' height='8' rx='4' ry='4' transform='rotate(60 16 16)'/>
    <rect x='4' y='12' width='24' height='8' rx='4' ry='4' transform='rotate(120 16 16)'/>
    <circle cx='16' cy='16' r='7.5' />
  </g>
  <!-- Center hole cutout -->
  <circle cx='16' cy='16' r='3.2' fill='#34b4e8' stroke='#0d2847' stroke-width='2'/>
</svg>
