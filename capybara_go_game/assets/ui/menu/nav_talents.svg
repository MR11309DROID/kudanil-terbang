<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="talentHexGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Laurel Wreath Leaves (Left and Right Arches) -->
  <g fill="url(#leafGreen)" stroke="#111827" stroke-width="1.8" stroke-linejoin="round">
    <!-- Left Leaves -->
    <path d="M 12,50 C 6,42 6,28 16,18 C 18,22 18,28 14,34 C 18,34 20,38 18,44 Z"/>
    <ellipse cx="10" cy="34" rx="4.5" ry="3" transform="rotate(-30 10 34)"/>
    <ellipse cx="14" cy="24" rx="4.5" ry="3" transform="rotate(-45 14 24)"/>
    <ellipse cx="20" cy="16" rx="4.5" ry="3" transform="rotate(-60 20 16)"/>

    <!-- Right Leaves -->
    <path d="M 52,50 C 58,42 58,28 48,18 C 46,22 46,28 50,34 C 46,34 44,38 46,44 Z"/>
    <ellipse cx="54" cy="34" rx="4.5" ry="3" transform="rotate(30 54 34)"/>
    <ellipse cx="50" cy="24" rx="4.5" ry="3" transform="rotate(45 50 24)"/>
    <ellipse cx="44" cy="16" rx="4.5" ry="3" transform="rotate(60 44 16)"/>
  </g>

  <!-- Golden Hexagon Core (Upgrade Badge) -->
  <polygon points="32,16 46,24 46,40 32,48 18,40 18,24" 
           fill="url(#talentHexGold)" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
  
  <polygon points="32,20 42,26 42,38 32,44 22,38 22,26" 
           fill="#fef08a" opacity="0.4"/>

  <!-- Thick White/Dark Upward Arrow (Level Up) -->
  <polygon points="32,22 40,32 35,32 35,42 29,42 29,32 24,32" 
           fill="#ffffff" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
