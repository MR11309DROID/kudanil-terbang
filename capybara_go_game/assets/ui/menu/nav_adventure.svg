<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 64" width="100" height="64">
  <defs>
    <!-- Blade steel gradient -->
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <!-- Gold hilt gradient -->
    <linearGradient id="hiltGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="arrowGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Left Arrow Chevron -->
  <polygon points="12,32 20,24 20,40" fill="url(#arrowGold)" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Right Arrow Chevron -->
  <polygon points="88,32 80,24 80,40" fill="url(#arrowGold)" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Crossed Swords Center Group (Centered at 50, 30) -->
  <g transform="translate(50, 30)">
    <!-- Sword 1: Pointing Top-Right to Bottom-Left (-45 deg) -->
    <g transform="rotate(45)">
      <!-- Blade -->
      <polygon points="0,-28 7,-20 6,10 -6,10 -7,-20" fill="url(#bladeGrad)" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="0" y1="-26" x2="0" y2="9" stroke="#64748b" stroke-width="1.5"/>
      <!-- Crossguard -->
      <rect x="-13" y="10" width="26" height="6" rx="3" fill="url(#hiltGold)" stroke="#111827" stroke-width="2.2"/>
      <!-- Handle -->
      <rect x="-3.5" y="16" width="7" height="9" fill="#78350f" stroke="#111827" stroke-width="1.8"/>
      <!-- Pommel -->
      <circle cx="0" cy="28" r="4.5" fill="url(#hiltGold)" stroke="#111827" stroke-width="2"/>
    </g>

    <!-- Sword 2: Pointing Top-Left to Bottom-Right (+45 deg) -->
    <g transform="rotate(-45)">
      <!-- Blade -->
      <polygon points="0,-28 7,-20 6,10 -6,10 -7,-20" fill="url(#bladeGrad)" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="0" y1="-26" x2="0" y2="9" stroke="#64748b" stroke-width="1.5"/>
      <!-- Crossguard -->
      <rect x="-13" y="10" width="26" height="6" rx="3" fill="url(#hiltGold)" stroke="#111827" stroke-width="2.2"/>
      <!-- Handle -->
      <rect x="-3.5" y="16" width="7" height="9" fill="#78350f" stroke="#111827" stroke-width="1.8"/>
      <!-- Pommel -->
      <circle cx="0" cy="28" r="4.5" fill="url(#hiltGold)" stroke="#111827" stroke-width="2"/>
    </g>
  </g>
</svg>
