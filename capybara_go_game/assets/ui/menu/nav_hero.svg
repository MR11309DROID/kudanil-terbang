<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="helmGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="helmSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Helmet Dome -->
  <path d="M 12,38 C 12,18 20,8 32,8 C 44,8 52,18 52,38 C 52,48 48,56 46,58 L 18,58 C 16,56 12,48 12,38 Z" 
        fill="url(#helmGold)" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>

  <!-- Helmet Crest / Fin on Top -->
  <path d="M 29,7 C 29,4 32,2 35,2 C 35,4 35,7 35,9 L 29,9 Z" fill="#ca8a04" stroke="#111827" stroke-width="2"/>

  <!-- Horizontal Visor Band -->
  <path d="M 10,30 C 10,28 14,27 32,27 C 50,27 54,28 54,30 L 52,40 C 50,42 46,43 32,43 C 18,43 14,42 12,40 Z" 
        fill="url(#helmGold)" stroke="#111827" stroke-width="2.8"/>

  <!-- Dark Visor Slit (Eye Slot) -->
  <path d="M 16,33 C 20,32 44,32 48,33 L 47,38 C 44,37 20,37 17,38 Z" fill="#0f172a" stroke="#111827" stroke-width="1.5"/>

  <!-- Vertical Mouth Grille Slits -->
  <g stroke="#111827" stroke-width="2.5" stroke-linecap="round">
    <line x1="24" y1="46" x2="24" y2="54"/>
    <line x1="32" y1="46" x2="32" y2="55"/>
    <line x1="40" y1="46" x2="40" y2="54"/>
  </g>

  <!-- Side Ear Rivets -->
  <circle cx="12" cy="35" r="3" fill="#ca8a04" stroke="#111827" stroke-width="1.8"/>
  <circle cx="52" cy="35" r="3" fill="#ca8a04" stroke="#111827" stroke-width="1.8"/>
</svg>
