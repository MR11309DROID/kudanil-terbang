<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" width="100" height="90">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="chestGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <!-- Iron Band Gradient -->
    <linearGradient id="chestIron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Purple Gem Gradient -->
    <linearGradient id="chestGem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="30%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <!-- Gold Trim Highlight -->
    <linearGradient id="gemRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="50" cy="84" rx="42" ry="6" fill="#000000" opacity="0.3"/>

  <!-- Chest Body (Bottom base) -->
  <path d="M 16,36 L 84,36 C 86,36 88,38 88,41 L 84,76 C 84,79 81,82 78,82 L 22,82 C 19,82 16,79 16,76 L 12,41 C 12,38 14,36 16,36 Z" 
        fill="url(#chestIron)" stroke="#111827" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Vertical Golden Planks (Base) -->
  <rect x="22" y="38" width="16" height="42" rx="2" fill="url(#chestGold)" stroke="#111827" stroke-width="2.5"/>
  <rect x="42" y="38" width="16" height="42" rx="2" fill="url(#chestGold)" stroke="#111827" stroke-width="2.5"/>
  <rect x="62" y="38" width="16" height="42" rx="2" fill="url(#chestGold)" stroke="#111827" stroke-width="2.5"/>

  <!-- Chest Lid (Arched Top) -->
  <path d="M 12,38 C 12,18 24,8 50,8 C 76,8 88,18 88,38 Z" 
        fill="url(#chestIron)" stroke="#111827" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Vertical Golden Ribs on Lid -->
  <path d="M 22,38 C 22,21 30,13 38,11 L 38,38 Z" fill="url(#chestGold)" stroke="#111827" stroke-width="2.5"/>
  <path d="M 42,38 C 42,10 58,10 58,38 Z" fill="url(#chestGold)" stroke="#111827" stroke-width="2.5"/>
  <path d="M 62,38 C 70,13 78,21 78,38 Z" fill="url(#chestGold)" stroke="#111827" stroke-width="2.5"/>

  <!-- Center Horizontal Iron/Gold Belt Rim -->
  <rect x="9" y="34" width="82" height="9" rx="3.5" fill="url(#chestGold)" stroke="#111827" stroke-width="3"/>
  <rect x="12" y="36.5" width="76" height="3" rx="1.5" fill="#fef08a" opacity="0.8"/>

  <!-- Center Diamond Purple Gemstone Clasp -->
  <g transform="translate(50, 38.5)">
    <!-- Outer Gold Diamond Frame -->
    <polygon points="0,-16 16,0 0,16 -16,0" fill="url(#gemRim)" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
    <!-- Inner Purple Gem -->
    <polygon points="0,-11 11,0 0,11 -11,0" fill="url(#chestGem)" stroke="#111827" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Specular Highlight Dot -->
    <circle cx="-3" cy="-3" r="2.5" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
