<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="lockSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Outer Shield Silhouette -->
  <path d="M 32,8 C 44,8 52,10 52,22 C 52,42 36,54 32,58 C 28,54 12,42 12,22 C 12,10 20,8 32,8 Z" 
        fill="url(#shieldSilver)" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>

  <!-- Inner Recessed Shield -->
  <path d="M 32,12 C 41,12 47,14 47,23 C 47,38 35,48 32,52 C 29,48 17,38 17,23 C 17,14 23,12 32,12 Z" 
        fill="#334155" stroke="#111827" stroke-width="2"/>

  <!-- Padlock Shackle / Loop -->
  <path d="M 26,29 L 26,24 C 26,20 30,17 32,17 C 34,17 38,20 38,24 L 38,29" 
        fill="none" stroke="#f1f5f9" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Padlock Body -->
  <rect x="22" y="27" width="20" height="17" rx="3.5" fill="url(#lockSilver)" stroke="#111827" stroke-width="2.2"/>

  <!-- Keyhole -->
  <circle cx="32" cy="33.5" r="2.2" fill="#0f172a"/>
  <polygon points="31,33.5 33,33.5 34,39 30,39" fill="#0f172a"/>
</svg>
