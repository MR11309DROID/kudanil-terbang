<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="keyGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-30 16 16)">
    <!-- Key Bow / Ring -->
    <circle cx="10" cy="16" r="7" fill="url(#keyGoldGrad)" stroke="#1c1917" stroke-width="2.2"/>
    <circle cx="10" cy="16" r="3.2" fill="#84cc16" stroke="#1c1917" stroke-width="1.8"/>
    <!-- Key Stem -->
    <rect x="15" y="14.2" width="13" height="3.6" rx="1.2" fill="url(#keyGoldGrad)" stroke="#1c1917" stroke-width="2"/>
    <!-- Key Bits / Teeth -->
    <rect x="22" y="17.2" width="2.8" height="3.5" rx="0.8" fill="url(#keyGoldGrad)" stroke="#1c1917" stroke-width="1.8"/>
    <rect x="25.5" y="17.2" width="2.5" height="4.8" rx="0.8" fill="url(#keyGoldGrad)" stroke="#1c1917" stroke-width="1.8"/>
  </g>
</svg>
